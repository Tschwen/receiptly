<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin · Receipts</title>
<style>
  :root{--bark:#3a2e22;--clay:#7a5c42;--ochre:#b8842a;--sand:#d4c4a0;--linen:#f5f0e8;--white:#fff;--green:#4a7c59;--red:#c0392b;--radius:10px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Georgia',serif;background:var(--linen);color:var(--bark);min-height:100vh}

  header{background:var(--bark);color:var(--linen);padding:28px 32px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header h1{font-size:22px;font-weight:normal}
  header .sub{font-size:12px;color:var(--sand)}
  .back-link{font-size:13px;color:var(--sand);text-decoration:none;display:flex;align-items:center;gap:6px}
  .back-link:hover{color:var(--white)}

  main{max-width:900px;margin:0 auto;padding:28px 20px 60px}

  .quarter-group{margin-bottom:32px}
  .quarter-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--bark)}
  .quarter-title{font-size:18px;color:var(--bark)}
  .quarter-meta{font-size:12px;color:var(--clay)}
  .zip-btn{background:var(--bark);color:var(--white);border:none;border-radius:8px;padding:8px 16px;font-family:'Georgia',serif;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .zip-btn:hover{background:var(--clay)}

  table{width:100%;border-collapse:collapse}
  thead tr{background:var(--bark)}
  thead th{padding:10px 14px;text-align:left;font-weight:normal;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--linen)}
  tbody tr{background:var(--white);border-bottom:1px solid var(--sand)}
  tbody tr:nth-child(even){background:#faf7f2}
  tbody tr:hover{background:#fdf7ec}
  tbody td{padding:12px 14px;font-size:13px;color:var(--bark)}
  td.nr{font-weight:bold;white-space:nowrap}
  td.customer{color:var(--clay)}

  .pdf-link{color:var(--ochre);text-decoration:none;font-size:12px;display:inline-flex;align-items:center;gap:4px}
  .pdf-link:hover{color:var(--bark)}

  .empty{text-align:center;padding:48px;color:var(--clay);font-style:italic}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px}
  .stat-card{background:var(--white);border:1.5px solid var(--sand);border-radius:var(--radius);padding:16px 20px}
  .stat-val{font-size:26px;color:var(--bark);margin-bottom:4px}
  .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--clay)}

  .loading{text-align:center;padding:40px;color:var(--clay)}
  .spinner{width:24px;height:24px;border:2px solid var(--sand);border-top-color:var(--bark);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .items-section{margin-bottom:40px}
  .items-grid{display:flex;flex-direction:column;gap:6px}
  .item-row{display:flex;align-items:center;gap:10px;background:var(--white);border:1.5px solid var(--sand);border-radius:var(--radius);padding:10px 14px;transition:opacity .2s}
  .item-row.inactive{opacity:.45}
  .item-name{flex:1;font-size:14px;color:var(--bark)}
  .price-input{width:90px;text-align:right;padding:6px 10px;border:1.5px solid var(--sand);border-radius:8px;font-family:'Georgia',serif;font-size:15px;color:var(--bark);background:var(--white);outline:none;-webkit-appearance:none}
  .price-input:focus{border-color:var(--ochre);box-shadow:0 0 0 2px rgba(184,132,42,.15)}
  .price-unit{font-size:12px;color:var(--clay);white-space:nowrap}
  .toggle-active{width:36px;height:22px;border-radius:11px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
  .toggle-active.on{background:var(--green)}
  .toggle-active.off{background:var(--sand)}
  .save-btn{background:var(--ochre);color:var(--white);border:none;border-radius:8px;padding:8px 18px;font-family:'Georgia',serif;font-size:13px;cursor:pointer;margin-top:12px}
  .save-btn:hover{background:var(--bark)}
  .add-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .add-input{flex:1;min-width:140px;padding:9px 12px;border:1.5px solid var(--sand);border-radius:8px;font-family:'Georgia',serif;font-size:14px;color:var(--bark);background:var(--white);outline:none}
  .add-input:focus{border-color:var(--ochre)}
  .add-btn{background:var(--bark);color:var(--white);border:none;border-radius:8px;padding:9px 18px;font-family:'Georgia',serif;font-size:14px;cursor:pointer}
  .del-btn{background:none;border:none;color:var(--sand);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
  .del-btn:hover{color:var(--red)}
  .travel-rate-row{display:flex;align-items:center;gap:10px;background:var(--linen);border:1.5px solid var(--sand);border-radius:var(--radius);padding:10px 14px;margin-top:6px}
  .saved-badge{display:none;color:var(--green);font-size:12px;margin-top:6px}
  .saved-badge.show{display:block}
  .account-select{padding:6px 8px;border:1.5px solid var(--sand);border-radius:8px;font-family:'Georgia',serif;font-size:13px;color:var(--clay);background:var(--white);outline:none;cursor:pointer;-webkit-appearance:none;appearance:none;width:68px}
  .account-select:focus{border-color:var(--ochre)}
</style>
</head>
<body>

<header>
  <div>
    <h1>Receipts · Overview</h1>
    <div class="sub" id="hdr-sub">…</div>
  </div>
  <a href="/" class="back-link">← New Receipt</a>
</header>

<main>
  <!-- SETTINGS -->
  <div class="items-section" id="settings-section">
    <div class="quarter-header" style="margin-bottom:14px">
      <div>
        <div class="quarter-title">Settings</div>
        <div class="quarter-meta">Business details for PDF receipts</div>
      </div>
    </div>
    <div class="items-grid" style="gap:8px" id="settings-grid">
      <div class="loading"><div class="spinner"></div></div>
    </div>
    <button class="save-btn" onclick="saveSettings()">Save settings</button>
    <div class="saved-badge" id="settings-saved-badge">✓ Saved</div>
  </div>

  <!-- PRICE LIST -->
  <div class="items-section">
    <div class="quarter-header" style="margin-bottom:14px">
      <div>
        <div class="quarter-title">Price list</div>
        <div class="quarter-meta">Manage services and prices</div>
      </div>
    </div>
    <div class="items-grid" id="items-grid">
      <div class="loading"><div class="spinner"></div></div>
    </div>
    <!-- Travel rate (fixed row, price only) -->
    <div class="travel-rate-row" id="travel-row" style="display:none">
      <span class="item-name" style="color:var(--clay)">Travel</span>
      <input class="price-input" type="number" id="travel-rate-input" min="0" step="0.01" />
      <span class="price-unit">€ / km</span>
    </div>
    <!-- Add new service -->
    <div class="add-row" style="margin-top:14px">
      <input class="add-input" type="text" id="new-name" placeholder="New service…" />
      <input class="add-input" type="number" id="new-price" placeholder="Price €" min="0" step="0.01" style="max-width:110px" />
      <select class="add-input account-select" id="new-account" style="flex:0 0 auto;width:auto">
        <option value="4401">4401 – Main Services</option>
        <option value="4410">4410 – Venue / Rental</option>
        <option value="4420">4420 – Other Services</option>
        <option value="4830">4830 – Ancillary Revenue</option>
      </select>
      <button class="add-btn" onclick="addItem()">+ Add</button>
    </div>
    <button class="save-btn" onclick="saveAll()">Save price list</button>
    <div class="saved-badge" id="saved-badge">✓ Saved</div>
  </div>

  <!-- RECEIPTS -->
  <div id="stats" class="stats"></div>
  <div id="content"><div class="loading"><div class="spinner"></div>Loading receipts…</div></div>
</main>

<script>
const ACCOUNTS = [
  { code: '4401', label: '4401 – Main Services' },
  { code: '4410', label: '4410 – Venue / Rental' },
  { code: '4420', label: '4420 – Other Services' },
  { code: '4830', label: '4830 – Ancillary Revenue' },
];

function accountOptions(selected) {
  return ACCOUNTS.map(a =>
    `<option value="${a.code}" ${a.code === selected ? 'selected' : ''}>${a.label}</option>`
  ).join('');
}

let itemsData = [];
let configData = {};

const CONFIG_FIELDS = [
  { key: 'owner_name',    label: 'Owner name' },
  { key: 'business_name', label: 'Business name' },
  { key: 'address',       label: 'Address (for PDF)' },
  { key: 'city',          label: 'City (for signature line)' },
  { key: 'email',         label: 'Email' },
  { key: 'tax_note',      label: 'Tax note' },
];

async function init() {
  await Promise.all([loadSettings(), loadItems(), loadReceipts()]);
}

async function loadSettings() {
  const res = await fetch('/api/config');
  configData = await res.json();
  document.getElementById('hdr-sub').textContent =
    (configData.owner_name || '') + ' · ' + (configData.business_name || '');
  renderSettings();
}

function renderSettings() {
  const grid = document.getElementById('settings-grid');
  grid.innerHTML = CONFIG_FIELDS.map(f => `
    <div class="item-row" style="gap:12px">
      <span class="item-name" style="min-width:200px;flex:0 0 auto">${f.label}</span>
      <input class="price-input" style="width:100%;text-align:left;flex:1"
             type="text" data-cfg="${f.key}"
             value="${(configData[f.key] || '').replace(/"/g, '&quot;')}" />
    </div>`).join('');
}

async function saveSettings() {
  const updated = {};
  document.querySelectorAll('[data-cfg]').forEach(el => {
    updated[el.dataset.cfg] = el.value;
  });
  await fetch('/api/config', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(updated),
  });
  configData = { ...configData, ...updated };
  document.getElementById('hdr-sub').textContent =
    (configData.owner_name || '') + ' · ' + (configData.business_name || '');
  const badge = document.getElementById('settings-saved-badge');
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 2500);
}

async function loadItems() {
  const res = await fetch('/api/items');
  itemsData = await res.json();
  renderItems();
}

function renderItems() {
  const grid = document.getElementById('items-grid');
  grid.innerHTML = itemsData.map((item, idx) => `
    <div class="item-row ${item.active ? '' : 'inactive'}" id="row-${idx}">
      <span class="item-name">${item.name}</span>
      <select class="account-select" data-account="${idx}">
        ${accountOptions(item.account || '4401')}
      </select>
      <input class="price-input" type="number" value="${item.price.toFixed(2)}"
             min="0" step="0.01" data-idx="${idx}" />
      <span class="price-unit">€</span>
      <button class="toggle-active ${item.active ? 'on' : 'off'}"
              onclick="toggleActive(${idx})" title="${item.active ? 'Disable' : 'Enable'}">
        ${item.active ? '✓' : '✗'}
      </button>
      <button class="del-btn" onclick="deleteItem(${idx})" title="Delete">×</button>
    </div>`).join('');

  document.getElementById('travel-row').style.display = 'flex';
  fetch('/api/travel').then(r => r.json()).then(d => {
    document.getElementById('travel-rate-input').value = d.rate.toFixed(2);
  }).catch(() => {
    document.getElementById('travel-rate-input').value = '0.41';
  });
}

function toggleActive(idx) {
  itemsData[idx].active = !itemsData[idx].active;
  renderItems();
}

function deleteItem(idx) {
  if (!confirm(`Really delete "${itemsData[idx].name}"?`)) return;
  itemsData.splice(idx, 1);
  renderItems();
}

function addItem() {
  const name = document.getElementById('new-name').value.trim();
  const price = parseFloat(document.getElementById('new-price').value);
  const account = document.getElementById('new-account').value;
  if (!name || isNaN(price) || price <= 0) {
    alert('Enter a name and a valid price'); return;
  }
  itemsData.push({ name, price, account, active: true });
  document.getElementById('new-name').value = '';
  document.getElementById('new-price').value = '';
  renderItems();
}

async function saveAll() {
  document.querySelectorAll('.price-input[data-idx]').forEach(input => {
    const idx = parseInt(input.dataset.idx);
    itemsData[idx].price = parseFloat(input.value) || itemsData[idx].price;
  });
  document.querySelectorAll('.account-select[data-account]').forEach(sel => {
    const idx = parseInt(sel.dataset.account);
    itemsData[idx].account = sel.value;
  });

  await fetch('/api/items', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(itemsData),
  });

  const travelRate = parseFloat(document.getElementById('travel-rate-input').value);
  if (!isNaN(travelRate)) {
    await fetch('/api/travel', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rate: travelRate }),
    });
  }

  const badge = document.getElementById('saved-badge');
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 2500);
}

async function loadReceipts() {
  try {
    const res = await fetch('/api/receipts');
    const data = await res.json();
    renderReceipts(data);
  } catch(e) {
    document.getElementById('content').innerHTML =
      `<div class="empty">Error: ${e.message}</div>`;
  }
}

function renderReceipts(receipts) {
  const total = receipts.length;
  const statsEl = document.getElementById('stats');
  statsEl.innerHTML = `
    <div class="stat-card"><div class="stat-val">${total}</div><div class="stat-label">Total receipts</div></div>`;

  if (total === 0) {
    document.getElementById('content').innerHTML = '<div class="empty">No receipts yet.</div>';
    return;
  }

  const groups = {};
  receipts.forEach(r => {
    if (!groups[r.quarter]) groups[r.quarter] = [];
    groups[r.quarter].push(r);
  });
  const sortedQ = Object.keys(groups).sort().reverse();

  statsEl.innerHTML += `
    <div class="stat-card"><div class="stat-val">${sortedQ.length}</div><div class="stat-label">Quarters</div></div>
    <div class="stat-card"><div class="stat-val">${sortedQ[0] || '—'}</div><div class="stat-label">Current quarter</div></div>`;

  document.getElementById('content').innerHTML = sortedQ.map(quarter => {
    const items = groups[quarter];
    const [year, q] = quarter.split('/');
    return `
      <div class="quarter-group">
        <div class="quarter-header">
          <div>
            <div class="quarter-title">${quarter}</div>
            <div class="quarter-meta">${items.length} receipt${items.length !== 1 ? 's' : ''}</div>
          </div>
          <a href="/api/download/${year}/${q}" class="zip-btn" download>↓ ZIP</a>
        </div>
        <table>
          <thead><tr><th>No.</th><th>Customer</th><th>PDF</th></tr></thead>
          <tbody>
            ${items.map(r => `
              <tr>
                <td class="nr">${r.nr}</td>
                <td class="customer">${r.customer}</td>
                <td><a href="${r.pdf_url}" target="_blank" class="pdf-link">📄 open</a></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }).join('');
}

init();
</script>
</body>
</html>
